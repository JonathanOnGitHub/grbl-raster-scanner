<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRBL Pen Plotter Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            font-size: 2.5em;
        }

        .connection-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .panel-title {
            font-size: 1.3em;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
            transition: all 0.3s;
        }

        .status-indicator.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            margin: 5px;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        button.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .jog-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 250px;
            margin: 20px auto;
        }

        .jog-btn {
            aspect-ratio: 1;
            font-size: 1.5em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jog-btn:nth-child(2) { grid-column: 2; }
        .jog-btn:nth-child(3) { grid-column: 1; grid-row: 2; }
        .jog-btn:nth-child(4) { grid-column: 2; grid-row: 2; }
        .jog-btn:nth-child(5) { grid-column: 3; grid-row: 2; }
        .jog-btn:nth-child(6) { grid-column: 2; grid-row: 3; }

        .input-group {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9em;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1em;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: monospace;
        }

        .position-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            margin: 10px 0;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .coordinate {
            display: inline-block;
            margin: 0 15px;
        }

        .coordinate span {
            color: #00d4ff;
            font-weight: bold;
        }

        .console {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .console-line {
            margin: 2px 0;
            padding: 2px 0;
        }

        .console-line.sent { color: #00d4ff; }
        .console-line.received { color: #00ff88; }
        .console-line.error { color: #ff4444; }
        .console-line.info { color: #ffaa00; }

        .z-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .z-controls button {
            font-size: 1.2em;
            padding: 15px 20px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .speed-control {
            margin: 15px 0;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .preview-canvas {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            width: 100%;
            height: 300px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 GRBL Pen Plotter</h1>

        <!-- Connection Panel -->
        <div class="connection-panel">
            <div class="panel-title">
                <div class="status-indicator" id="statusIndicator"></div>
                Serial Connection
            </div>
            <button id="connectBtn" onclick="connectSerial()">Connect to GRBL</button>
            <button class="secondary" onclick="sendCommand('$H')">Home ($H)</button>
            <button class="danger" onclick="sendCommand('!')">Hold (!)</button>
            <button class="success" onclick="sendCommand('~')">Resume (~)</button>
            <button class="danger" onclick="sendCommand('\x18')">Reset (Ctrl-X)</button>
        </div>

        <div class="controls-grid">
            <!-- Position & Jogging -->
            <div class="control-panel">
                <div class="panel-title">Position & Jogging</div>
                <div class="position-display">
                    <div class="coordinate">X: <span id="posX">0.00</span></div>
                    <div class="coordinate">Y: <span id="posY">0.00</span></div>
                    <div class="coordinate">Z: <span id="posZ">0.00</span></div>
                </div>

                <div class="speed-control">
                    <label>Jog Distance (mm): <span id="jogDistVal">10</span></label>
                    <input type="range" id="jogDistance" min="0.1" max="50" step="0.1" value="10" oninput="document.getElementById('jogDistVal').textContent=this.value">
                </div>

                <div class="speed-control">
                    <label>Feed Rate (mm/min): <span id="feedRateVal">1000</span></label>
                    <input type="range" id="feedRate" min="100" max="5000" step="100" value="1000" oninput="document.getElementById('feedRateVal').textContent=this.value">
                </div>

                <div class="jog-pad">
                    <button class="jog-btn" onclick="jog(0, 1, 0)">▲</button>
                    <button class="jog-btn" onclick="jog(-1, 0, 0)">◀</button>
                    <button class="jog-btn secondary" onclick="setStartHere()">⭐</button>
                    <button class="jog-btn" onclick="jog(1, 0, 0)">▶</button>
                    <button class="jog-btn" onclick="jog(0, -1, 0)">▼</button>
                </div>

                <div class="z-controls">
                    <button class="secondary" onclick="jog(0, 0, 1)">Z▲ Up</button>
                    <button class="success" onclick="setContact()">Set Contact</button>
                    <button class="secondary" onclick="jog(0, 0, -1)">Z▼ Down</button>
                </div>

                <div class="preset-buttons">
                    <button onclick="goToStart()">Go to Start</button>
                    <button onclick="penUp()">Pen Up</button>
                    <button onclick="penDown()">Pen Down</button>
                </div>
            </div>

            <!-- Text Plotting -->
            <div class="control-panel">
                <div class="panel-title">Text Plotting</div>

                <div class="input-group">
                    <label>Text to Plot:</label>
                    <textarea id="plotText" placeholder="Enter text to plot...
Supports multiple lines
Adjust settings below"></textarea>
                </div>

                <div class="input-group">
                    <label>Font Size (mm height):</label>
                    <input type="number" id="fontSize" value="10" min="1" max="50">
                </div>

                <div class="input-group">
                    <label>Line Spacing (mm):</label>
                    <input type="number" id="lineSpacing" value="15" min="1" max="50">
                </div>

                <div class="input-group">
                    <label>Letter Spacing (mm):</label>
                    <input type="number" id="letterSpacing" value="2" min="0" max="10" step="0.5">
                </div>

                <button class="success" onclick="plotText()" style="width: 100%; margin-top: 10px;">Plot Text</button>
                <button onclick="previewText()" style="width: 100%;">Preview</button>
            </div>

            <!-- G-Code Console -->
            <div class="control-panel">
                <div class="panel-title">G-Code Console</div>
                <div class="input-group">
                    <label>Manual G-Code:</label>
                    <input type="text" id="manualGcode" placeholder="G1 X10 Y10 F1000" onkeypress="if(event.key==='Enter')sendManualGcode()">
                </div>
                <button onclick="sendManualGcode()">Send G-Code</button>
                <button class="secondary" onclick="clearConsole()">Clear Console</button>

                <div class="console" id="console"></div>
            </div>

            <!-- Settings -->
            <div class="control-panel">
                <div class="panel-title">Pen Settings</div>

                <div class="input-group">
                    <label>Safe Z Height (mm):</label>
                    <input type="number" id="safeZ" value="5" min="0" max="20">
                </div>

                <div class="input-group">
                    <label>Contact Z Position (mm):</label>
                    <input type="number" id="contactZ" value="0" min="-5" max="5" step="0.1">
                </div>

                <div class="input-group">
                    <label>Start X Position (mm):</label>
                    <input type="number" id="startX" value="0" step="0.1">
                </div>

                <div class="input-group">
                    <label>Start Y Position (mm):</label>
                    <input type="number" id="startY" value="0" step="0.1">
                </div>

                <div class="preset-buttons">
                    <button onclick="saveSettings()">Save Settings</button>
                    <button onclick="loadSettings()">Load Settings</button>
                </div>
            </div>
        </div>

        <!-- Preview Canvas -->
        <div class="control-panel">
            <div class="panel-title">Preview</div>
            <canvas id="previewCanvas" class="preview-canvas"></canvas>
        </div>
    </div>

    <script>
        let port = null;
        let reader = null;
        let writer = null;
        let currentPos = { x: 0, y: 0, z: 0 };
        let isConnected = false;

        // Simple 5x7 font definition (1 = draw, 0 = move)
        const font5x7 = {
            'A': [0x7E, 0x09, 0x09, 0x09, 0x7E],
            'B': [0x7F, 0x49, 0x49, 0x49, 0x36],
            'C': [0x3E, 0x41, 0x41, 0x41, 0x22],
            'D': [0x7F, 0x41, 0x41, 0x22, 0x1C],
            'E': [0x7F, 0x49, 0x49, 0x49, 0x41],
            'F': [0x7F, 0x09, 0x09, 0x09, 0x01],
            'G': [0x3E, 0x41, 0x49, 0x49, 0x7A],
            'H': [0x7F, 0x08, 0x08, 0x08, 0x7F],
            'I': [0x00, 0x41, 0x7F, 0x41, 0x00],
            'J': [0x20, 0x40, 0x41, 0x3F, 0x01],
            'K': [0x7F, 0x08, 0x14, 0x22, 0x41],
            'L': [0x7F, 0x40, 0x40, 0x40, 0x40],
            'M': [0x7F, 0x02, 0x0C, 0x02, 0x7F],
            'N': [0x7F, 0x04, 0x08, 0x10, 0x7F],
            'O': [0x3E, 0x41, 0x41, 0x41, 0x3E],
            'P': [0x7F, 0x09, 0x09, 0x09, 0x06],
            'Q': [0x3E, 0x41, 0x51, 0x21, 0x5E],
            'R': [0x7F, 0x09, 0x19, 0x29, 0x46],
            'S': [0x46, 0x49, 0x49, 0x49, 0x31],
            'T': [0x01, 0x01, 0x7F, 0x01, 0x01],
            'U': [0x3F, 0x40, 0x40, 0x40, 0x3F],
            'V': [0x1F, 0x20, 0x40, 0x20, 0x1F],
            'W': [0x3F, 0x40, 0x38, 0x40, 0x3F],
            'X': [0x63, 0x14, 0x08, 0x14, 0x63],
            'Y': [0x07, 0x08, 0x70, 0x08, 0x07],
            'Z': [0x61, 0x51, 0x49, 0x45, 0x43],
            '0': [0x3E, 0x51, 0x49, 0x45, 0x3E],
            '1': [0x00, 0x42, 0x7F, 0x40, 0x00],
            '2': [0x42, 0x61, 0x51, 0x49, 0x46],
            '3': [0x21, 0x41, 0x45, 0x4B, 0x31],
            '4': [0x18, 0x14, 0x12, 0x7F, 0x10],
            '5': [0x27, 0x45, 0x45, 0x45, 0x39],
            '6': [0x3C, 0x4A, 0x49, 0x49, 0x30],
            '7': [0x01, 0x71, 0x09, 0x05, 0x03],
            '8': [0x36, 0x49, 0x49, 0x49, 0x36],
            '9': [0x06, 0x49, 0x49, 0x29, 0x1E],
            ' ': [0x00, 0x00, 0x00, 0x00, 0x00],
            '.': [0x00, 0x60, 0x60, 0x00, 0x00],
            ',': [0x00, 0x80, 0x60, 0x20, 0x00],
            '!': [0x00, 0x00, 0x5F, 0x00, 0x00],
            '?': [0x02, 0x01, 0x51, 0x09, 0x06],
            '-': [0x08, 0x08, 0x08, 0x08, 0x08],
            '_': [0x40, 0x40, 0x40, 0x40, 0x40]
        };

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                writer = port.writable.getWriter();
                reader = port.readable.getReader();

                isConnected = true;
                document.getElementById('statusIndicator').classList.add('connected');
                document.getElementById('connectBtn').textContent = 'Connected';
                document.getElementById('connectBtn').disabled = true;

                log('Connected to GRBL', 'info');

                // Wake up GRBL
                await sendCommand('');
                await new Promise(r => setTimeout(r, 100));
                await sendCommand('$I'); // Get build info

                readLoop();
            } catch (err) {
                log('Connection failed: ' + err.message, 'error');
            }
        }

        async function readLoop() {
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const text = new TextDecoder().decode(value);
                    handleResponse(text);
                }
            } catch (err) {
                log('Read error: ' + err.message, 'error');
            }
        }

        function handleResponse(text) {
            const lines = text.split('\n');
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                log(line, 'received');

                // Parse position reports
                if (line.startsWith('<') || line.startsWith('MPos:') || line.startsWith('WPos:')) {
                    parsePosition(line);
                }

                // Parse status
                if (line.includes('Idle')) {
                    requestPosition();
                }
            }
        }

        function parsePosition(line) {
            // Handle different position report formats
            let match = line.match(/WPos:([\d.-]+),([\d.-]+),([\d.-]+)/);
            if (!match) {
                match = line.match(/MPos:([\d.-]+),([\d.-]+),([\d.-]+)/);
            }
            if (!match && line.startsWith('<')) {
                // Format: <Idle|MPos:0.000,0.000,0.000|WPos:0.000,0.000,0.000>
                const wpos = line.match(/WPos:([\d.-]+),([\d.-]+),([\d.-]+)/);
                if (wpos) match = wpos;
            }

            if (match) {
                currentPos.x = parseFloat(match[1]);
                currentPos.y = parseFloat(match[2]);
                currentPos.z = parseFloat(match[3]);
                updatePositionDisplay();
            }
        }

        function updatePositionDisplay() {
            document.getElementById('posX').textContent = currentPos.x.toFixed(2);
            document.getElementById('posY').textContent = currentPos.y.toFixed(2);
            document.getElementById('posZ').textContent = currentPos.z.toFixed(2);
        }

        async function sendCommand(cmd) {
            if (!isConnected || !writer) {
                log('Not connected', 'error');
                return;
            }

            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + '\n'));
            log('> ' + cmd, 'sent');
        }

        function sendManualGcode() {
            const cmd = document.getElementById('manualGcode').value.trim();
            if (cmd) {
                sendCommand(cmd);
                document.getElementById('manualGcode').value = '';
            }
        }

        function jog(dx, dy, dz) {
            const dist = parseFloat(document.getElementById('jogDistance').value);
            const feed = document.getElementById('feedRate').value;

            const x = dx * dist;
            const y = dy * dist;
            const z = dz * dist;

            // Use G91 (relative) for jogging
            sendCommand(`$J=G91 G21 X${x} Y${y} Z${z} F${feed}`);
        }

        function setStartHere() {
            document.getElementById('startX').value = currentPos.x.toFixed(2);
            document.getElementById('startY').value = currentPos.y.toFixed(2);
            log(`Start position set to X:${currentPos.x.toFixed(2)} Y:${currentPos.y.toFixed(2)}`, 'info');
        }

        function setContact() {
            document.getElementById('contactZ').value = currentPos.z.toFixed(2);
            log(`Contact Z set to ${currentPos.z.toFixed(2)}mm`, 'info');
        }

        function goToStart() {
            const x = document.getElementById('startX').value;
            const y = document.getElementById('startY').value;
            const safeZ = document.getElementById('safeZ').value;
            const feed = document.getElementById('feedRate').value;

            sendCommand('G90'); // Absolute positioning
            sendCommand(`G0 Z${safeZ}`); // Raise pen
            sendCommand(`G0 X${x} Y${y}`); // Move to start
        }

        function penUp() {
            const safeZ = document.getElementById('safeZ').value;
            sendCommand('G90');
            sendCommand(`G0 Z${safeZ}`);
        }

        function penDown() {
            const contactZ = document.getElementById('contactZ').value;
            sendCommand('G90');
            sendCommand(`G1 Z${contactZ} F500`);
        }

        function requestPosition() {
            sendCommand('?');
        }

        // Periodic position updates
        setInterval(() => {
            if (isConnected) requestPosition();
        }, 1000);

        function log(msg, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        // Text plotting functions
        async function plotText() {
            const text = document.getElementById('plotText').value.toUpperCase();
            if (!text.trim()) {
                log('No text to plot', 'error');
                return;
            }

            const fontHeight = parseFloat(document.getElementById('fontSize').value);
            const lineSpacing = parseFloat(document.getElementById('lineSpacing').value);
            const letterSpacing = parseFloat(document.getElementById('letterSpacing').value);
            const startX = parseFloat(document.getElementById('startX').value);
            const startY = parseFloat(document.getElementById('startY').value);
            const contactZ = parseFloat(document.getElementById('contactZ').value);
            const safeZ = parseFloat(document.getElementById('safeZ').value);
            const feed = parseInt(document.getElementById('feedRate').value);

            const lines = text.split('\n');

            // Generate G-code
            let gcode = [];
            gcode.push('G90'); // Absolute positioning
            gcode.push(`G0 Z${safeZ}`); // Start with pen up

            let currentY = startY;
            const scale = fontHeight / 7; // 7 is the font height in pixels

            for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
                const line = lines[lineIndex];
                let currentX = startX;

                for (let char of line) {
                    const charData = font5x7[char] || font5x7[' '];

                    // Draw character
                    for (let col = 0; col < 5; col++) {
                        const column = charData[col];

                        for (let row = 0; row < 7; row++) {
                            if (column & (1 << (6 - row))) {
                                // Pixel is set, move and draw
                                const pixelX = currentX + (col * scale);
                                const pixelY = currentY + ((6 - row) * scale);

                                gcode.push(`G0 X${pixelX.toFixed(2)} Y${pixelY.toFixed(2)}`);
                                gcode.push(`G1 Z${contactZ} F${feed}`);
                                gcode.push(`G0 Z${safeZ}`);
                            }
                        }
                    }

                    currentX += (5 * scale) + letterSpacing;
                }

                currentY -= lineSpacing;
            }

            gcode.push(`G0 Z${safeZ}`);
            gcode.push(`G0 X${startX} Y${startY}`); // Return to start

            // Send G-code
            log('Sending text plot G-code...', 'info');
            for (let cmd of gcode) {
                await sendCommand(cmd);
                await new Promise(r => setTimeout(r, 50)); // Small delay between commands
            }
            log('Text plotting complete', 'info');
        }

        function previewText() {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const text = document.getElementById('plotText').value.toUpperCase();
            if (!text.trim()) return;

            const fontHeight = parseFloat(document.getElementById('fontSize').value);
            const lineSpacing = parseFloat(document.getElementById('lineSpacing').value);
            const letterSpacing = parseFloat(document.getElementById('letterSpacing').value);
            const scale = fontHeight / 7;

            // Center in canvas
            const lines = text.split('\n');
            const maxWidth = Math.max(...lines.map(l => l.length * (5 * scale + letterSpacing)));
            const totalHeight = lines.length * lineSpacing;

            const offsetX = (canvas.width - maxWidth) / 2;
            const offsetY = (canvas.height - totalHeight) / 2 + (lines.length * lineSpacing) / 2;

            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
                const line = lines[lineIndex];
                let currentX = offsetX;
                const currentY = offsetY + (lineIndex * lineSpacing);

                for (let char of line) {
                    const charData = font5x7[char] || font5x7[' '];

                    for (let col = 0; col < 5; col++) {
                        const column = charData[col];

                        for (let row = 0; row < 7; row++) {
                            if (column & (1 << (6 - row))) {
                                const pixelX = currentX + (col * scale * 5); // Scale up for visibility
                                const pixelY = currentY + ((6 - row) * scale * 5);

                                ctx.beginPath();
                                ctx.arc(pixelX, pixelY, scale * 2, 0, Math.PI * 2);
                                ctx.stroke();
                            }
                        }
                    }

                    currentX += (5 * scale * 5) + (letterSpacing * 5);
                }
            }
        }

        function saveSettings() {
            const settings = {
                safeZ: document.getElementById('safeZ').value,
                contactZ: document.getElementById('contactZ').value,
                startX: document.getElementById('startX').value,
                startY: document.getElementById('startY').value,
                fontSize: document.getElementById('fontSize').value,
                lineSpacing: document.getElementById('lineSpacing').value,
                letterSpacing: document.getElementById('letterSpacing').value,
                feedRate: document.getElementById('feedRate').value
            };
            localStorage.setItem('plotterSettings', JSON.stringify(settings));
            log('Settings saved', 'info');
        }

        function loadSettings() {
            const saved = localStorage.getItem('plotterSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                document.getElementById('safeZ').value = settings.safeZ;
                document.getElementById('contactZ').value = settings.contactZ;
                document.getElementById('startX').value = settings.startX;
                document.getElementById('startY').value = settings.startY;
                document.getElementById('fontSize').value = settings.fontSize;
                document.getElementById('lineSpacing').value = settings.lineSpacing;
                document.getElementById('letterSpacing').value = settings.letterSpacing;
                document.getElementById('feedRate').value = settings.feedRate;
                document.getElementById('feedRateVal').textContent = settings.feedRate;
                log('Settings loaded', 'info');
            }
        }

        // Load settings on startup
        window.onload = loadSettings;

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            switch(e.key) {
                case 'ArrowUp': jog(0, 1, 0); break;
                case 'ArrowDown': jog(0, -1, 0); break;
                case 'ArrowLeft': jog(-1, 0, 0); break;
                case 'ArrowRight': jog(1, 0, 0); break;
                case 'PageUp': jog(0, 0, 1); break;
                case 'PageDown': jog(0, 0, -1); break;
                case 'Home': sendCommand('$H'); break;
            }
        });
    </script>
</body>
</html>
