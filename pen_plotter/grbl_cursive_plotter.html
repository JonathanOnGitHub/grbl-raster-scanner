<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRBL Cursive Pen Plotter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            font-size: 2.5em;
        }

        .connection-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .panel-title {
            font-size: 1.3em;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
            transition: all 0.3s;
        }

        .status-indicator.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            margin: 5px;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        button.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        button.accent {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #1a1a2e;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .jog-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 250px;
            margin: 20px auto;
        }

        .jog-btn {
            aspect-ratio: 1;
            font-size: 1.5em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jog-btn:nth-child(2) { grid-column: 2; }
        .jog-btn:nth-child(3) { grid-column: 1; grid-row: 2; }
        .jog-btn:nth-child(4) { grid-column: 2; grid-row: 2; }
        .jog-btn:nth-child(5) { grid-column: 3; grid-row: 2; }
        .jog-btn:nth-child(6) { grid-column: 2; grid-row: 3; }

        .input-group {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9em;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1em;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: 'Segoe UI', sans-serif;
        }

        .position-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            margin: 10px 0;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .coordinate {
            display: inline-block;
            margin: 0 15px;
        }

        .coordinate span {
            color: #00d4ff;
            font-weight: bold;
        }

        .console {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .console-line {
            margin: 2px 0;
            padding: 2px 0;
        }

        .console-line.sent { color: #00d4ff; }
        .console-line.received { color: #00ff88; }
        .console-line.error { color: #ff4444; }
        .console-line.info { color: #ffaa00; }

        .z-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .z-controls button {
            font-size: 1.2em;
            padding: 15px 20px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .speed-control {
            margin: 15px 0;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .preview-canvas {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            width: 100%;
            height: 400px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .font-selector {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .font-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .font-btn.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.2);
        }

        .font-btn:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .slider-value {
            color: #00d4ff;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        input[type="checkbox"] {
            width: auto;
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ GRBL Cursive Pen Plotter</h1>

        <!-- Connection Panel -->
        <div class="connection-panel">
            <div class="panel-title">
                <div class="status-indicator" id="statusIndicator"></div>
                Serial Connection
            </div>
            <button id="connectBtn" onclick="connectSerial()">Connect to GRBL</button>
            <button class="secondary" onclick="sendCommand('$H')">Home ($H)</button>
            <button class="danger" onclick="sendCommand('!')">Hold (!)</button>
            <button class="success" onclick="sendCommand('~')">Resume (~)</button>
            <button class="danger" onclick="sendCommand('\x18')">Reset (Ctrl-X)</button>
            <button class="accent" onclick="sendCommand('$G')">View G-code Parser State</button>
        </div>

        <div class="controls-grid">
            <!-- Position & Jogging -->
            <div class="control-panel">
                <div class="panel-title">Position & Jogging</div>
                <div class="position-display">
                    <div class="coordinate">X: <span id="posX">0.00</span></div>
                    <div class="coordinate">Y: <span id="posY">0.00</span></div>
                    <div class="coordinate">Z: <span id="posZ">0.00</span></div>
                </div>

                <div class="speed-control">
                    <label>Jog Distance (mm): <span id="jogDistVal" class="slider-value">10</span></label>
                    <input type="range" id="jogDistance" min="0.1" max="50" step="0.1" value="10" oninput="document.getElementById('jogDistVal').textContent=this.value">
                </div>

                <div class="speed-control">
                    <label>Feed Rate (mm/min): <span id="feedRateVal" class="slider-value">1500</span></label>
                    <input type="range" id="feedRate" min="100" max="8000" step="100" value="1500" oninput="document.getElementById('feedRateVal').textContent=this.value">
                </div>

                <div class="jog-pad">
                    <button class="jog-btn" onclick="jog(0, 1, 0)">▲</button>
                    <button class="jog-btn" onclick="jog(-1, 0, 0)">◀</button>
                    <button class="jog-btn secondary" onclick="setStartHere()">⭐</button>
                    <button class="jog-btn" onclick="jog(1, 0, 0)">▶</button>
                    <button class="jog-btn" onclick="jog(0, -1, 0)">▼</button>
                </div>

                <div class="z-controls">
                    <button class="secondary" onclick="jog(0, 0, 1)">Z▲ Up</button>
                    <button class="success" onclick="setContact()">Set Contact</button>
                    <button class="secondary" onclick="jog(0, 0, -1)">Z▼ Down</button>
                </div>

                <div class="preset-buttons">
                    <button onclick="goToStart()">Go to Start</button>
                    <button onclick="penUp()">Pen Up</button>
                    <button onclick="penDown()">Pen Down</button>
                    <button class="accent" onclick="testPattern()">Test Pattern</button>
                </div>
            </div>

            <!-- Text Plotting -->
            <div class="control-panel">
                <div class="panel-title">Text Plotting</div>

                <div class="input-group">
                    <label>Font Style:</label>
                    <div class="font-selector">
                        <button class="font-btn active" onclick="setFont('cursive')" id="btn-cursive">Cursive</button>
                        <button class="font-btn" onclick="setFont('block')" id="btn-block">Block</button>
                        <button class="font-btn" onclick="setFont('serif')" id="btn-serif">Serif</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Text to Plot:</label>
                    <textarea id="plotText" placeholder="Enter text to plot...
Multiple lines supported
Cursive connects letters beautifully"></textarea>
                </div>

                <div class="speed-control">
                    <label>Letter Height (mm): <span id="fontSizeVal" class="slider-value">15</span></label>
                    <input type="range" id="fontSize" min="5" max="50" step="1" value="15" oninput="document.getElementById('fontSizeVal').textContent=this.value">
                </div>

                <div class="speed-control">
                    <label>Letter Width Factor: <span id="widthFactorVal" class="slider-value">1.0</span></label>
                    <input type="range" id="widthFactor" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('widthFactorVal').textContent=this.value">
                </div>

                <div class="speed-control">
                    <label>Slant Angle: <span id="slantVal" class="slider-value">15</span>°</label>
                    <input type="range" id="slant" min="-30" max="30" step="1" value="15" oninput="document.getElementById('slantVal').textContent=this.value">
                </div>

                <div class="speed-control">
                    <label>Line Spacing (mm): <span id="lineSpacingVal" class="slider-value">20</span></label>
                    <input type="range" id="lineSpacing" min="10" max="60" step="1" value="20" oninput="document.getElementById('lineSpacingVal').textContent=this.value">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="connectLetters" checked>
                    <label for="connectLetters" style="margin: 0;">Connect letters (ligatures)</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="optimizePath" checked>
                    <label for="optimizePath" style="margin: 0;">Optimize drawing path</label>
                </div>

                <button class="success" onclick="plotText()" style="width: 100%; margin-top: 10px; padding: 15px;">✨ Plot Text</button>
                <button onclick="previewText()" style="width: 100%;">👁️ Preview</button>
                <button class="secondary" onclick="exportGcode()" style="width: 100%;">📄 Export G-code</button>
            </div>

            <!-- G-Code Console -->
            <div class="control-panel">
                <div class="panel-title">G-Code Console</div>
                <div class="input-group">
                    <label>Manual G-Code:</label>
                    <input type="text" id="manualGcode" placeholder="G1 X10 Y10 F1500" onkeypress="if(event.key==='Enter')sendManualGcode()">
                </div>
                <button onclick="sendManualGcode()">Send G-Code</button>
                <button class="secondary" onclick="clearConsole()">Clear Console</button>

                <div class="console" id="console"></div>
            </div>

            <!-- Settings -->
            <div class="control-panel">
                <div class="panel-title">Pen & Motion Settings</div>

                <div class="input-group">
                    <label>Safe Z Height (mm):</label>
                    <input type="number" id="safeZ" value="5" min="0" max="20" step="0.5">
                </div>

                <div class="input-group">
                    <label>Contact Z Position (mm):</label>
                    <input type="number" id="contactZ" value="0" min="-5" max="5" step="0.1">
                </div>

                <div class="input-group">
                    <label>Pen Down Feed (mm/min):</label>
                    <input type="number" id="drawFeed" value="800" min="100" max="3000" step="50">
                </div>

                <div class="input-group">
                    <label>Start X Position (mm):</label>
                    <input type="number" id="startX" value="10" step="0.1">
                </div>

                <div class="input-group">
                    <label>Start Y Position (mm):</label>
                    <input type="number" id="startY" value="50" step="0.1">
                </div>

                <div class="input-group">
                    <label>Acceleration smoothing:</label>
                    <select id="smoothing">
                        <option value="0.01">High precision (0.01mm)</option>
                        <option value="0.05" selected>Balanced (0.05mm)</option>
                        <option value="0.1">Fast (0.1mm)</option>
                    </select>
                </div>

                <div class="preset-buttons">
                    <button onclick="saveSettings()">💾 Save Settings</button>
                    <button onclick="loadSettings()">📂 Load Settings</button>
                </div>
            </div>
        </div>

        <!-- Preview Canvas -->
        <div class="control-panel">
            <div class="panel-title">Preview Canvas</div>
            <canvas id="previewCanvas" class="preview-canvas"></canvas>
        </div>
    </div>

    <script>
        let port = null;
        let reader = null;
        let writer = null;
        let currentPos = { x: 0, y: 0, z: 0 };
        let isConnected = false;
        let currentFont = 'cursive';
        let currentGcode = [];

                    ['C', 0.2, 0.6, 0.5, 0.6, 0.5, 0.9], ['C', 0.5, 1.1, 0.2, 1.1, 0.1, 0.9]
                ],
                '6': [
                    ['M', 0.5, 0.3], ['C', 0.3, 0.1, 0.1, 0.4, 0.1, 0.7],
                    ['C', 0.1, 1.0, 0.5, 1.0, 0.5, 0.7], ['C', 0.5, 0.5, 0.2, 0.5, 0.2, 0.7]
                ],
                '7': [['M', 0.1, 0.5], ['L', 0.5, 0.5], ['L', 0.2, 1.0]],
                '8': [
                    ['M', 0.3, 0.75], ['C', 0.1, 0.75, 0.1, 0.5, 0.3, 0.5],
                    ['C', 0.5, 0.5, 0.5, 0.75, 0.3, 0.75], ['C', 0.1, 0.75, 0.1, 1.0, 0.3, 1.0],
                    ['C', 0.5, 1.0, 0.5, 0.75, 0.3, 0.75]
                ],
                '9': [
                    ['M', 0.5, 0.7], ['C', 0.5, 1.0, 0.1, 1.0, 0.1, 0.7],
                    ['C', 0.1, 0.4, 0.5, 0.4, 0.5, 0.7], ['C', 0.5, 0.9, 0.3, 0.9, 0.2, 0.7]
                ]
            },
            block: {
                // Simple block letters
                'a': [
                    ['M', 0, 0.5], ['L', 0, 1], ['L', 0.5, 1], ['L', 0.5, 0.5], ['L', 0, 0.5],
                    ['M', 0, 0.75], ['L', 0.5, 0.75]
                ],
                'b': [
                    ['M', 0, 0], ['L', 0, 1], ['L', 0.5, 1], ['L', 0.5, 0.5], ['L', 0, 0.5]
                ],
                'c': [
                    ['M', 0.5, 0.5], ['L', 0, 0.5], ['L', 0, 1], ['L', 0.5, 1]
                ],
                ' ': [['M', 0.5, 1]],
                '.': [['M', 0.25, 0.95], ['L', 0.25, 0.9]],
                '-': [['M', 0, 0.75], ['L', 0.5, 0.75]]
            },
            serif: {
                // Elegant serif font
                'a': [
                    ['M', 0.6, 0.5], ['C', 0.6, 0.8, 0.1, 0.8, 0.1, 0.5],
                    ['C', 0.1, 0.2, 0.6, 0.2, 0.6, 0.5], ['L', 0.6, 1],
                    ['M', 0.6, 0.35], ['L', 0.7, 0.2]
                ],
                'b': [
                    ['M', 0.2, 1.2], ['L', 0.2, 0], ['L', 0.1, -0.1],
                    ['M', 0.2, 0.5], ['C', 0.2, 0.2, 0.6, 0.2, 0.6, 0.5],
                    ['C', 0.6, 0.8, 0.2, 0.8, 0.2, 0.5]
                ],
                ' ': [['M', 0.5, 1]],
                '.': [['M', 0.25, 0.95], ['L', 0.25, 0.9]]
            }
        };

        // Copy block and serif for all letters
        const allLetters = 'abcdefghijklmnopqrstuvwxyz0123456789 .,!?';
        for (let char of allLetters) {
            if (!fonts.block[char]) fonts.block[char] = fonts.block['a'];
            if (!fonts.serif[char]) fonts.serif[char] = fonts.serif['a'];
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                writer = port.writable.getWriter();
                reader = port.readable.getReader();

                isConnected = true;
                document.getElementById('statusIndicator').classList.add('connected');
                document.getElementById('connectBtn').textContent = 'Connected';
                document.getElementById('connectBtn').disabled = true;

                log('Connected to GRBL', 'info');

                await sendCommand('');
                await new Promise(r => setTimeout(r, 100));
                await sendCommand('$I');

                readLoop();
            } catch (err) {
                log('Connection failed: ' + err.message, 'error');
            }
        }

        async function readLoop() {
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const text = new TextDecoder().decode(value);
                    handleResponse(text);
                }
            } catch (err) {
                log('Read error: ' + err.message, 'error');
            }
        }

        function handleResponse(text) {
            const lines = text.split('\n');
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                log(line, 'received');

                if (line.startsWith('<') || line.startsWith('MPos:') || line.startsWith('WPos:')) {
                    parsePosition(line);
                }

                if (line.includes('Idle')) {
                    requestPosition();
                }
            }
        }

        function parsePosition(line) {
            let match = line.match(/WPos:([\d.-]+),([\d.-]+),([\d.-]+)/);
            if (!match) {
                match = line.match(/MPos:([\d.-]+),([\d.-]+),([\d.-]+)/);
            }
            if (!match && line.startsWith('<')) {
                const wpos = line.match(/WPos:([\d.-]+),([\d.-]+),([\d.-]+)/);
                if (wpos) match = wpos;
            }

            if (match) {
                currentPos.x = parseFloat(match[1]);
                currentPos.y = parseFloat(match[2]);
                currentPos.z = parseFloat(match[3]);
                updatePositionDisplay();
            }
        }

        function updatePositionDisplay() {
            document.getElementById('posX').textContent = currentPos.x.toFixed(2);
            document.getElementById('posY').textContent = currentPos.y.toFixed(2);
            document.getElementById('posZ').textContent = currentPos.z.toFixed(2);
        }

        async function sendCommand(cmd) {
            if (!isConnected || !writer) {
                log('Not connected', 'error');
                return;
            }

            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + '\n'));
            log('> ' + cmd, 'sent');
        }

        function sendManualGcode() {
            const cmd = document.getElementById('manualGcode').value.trim();
            if (cmd) {
                sendCommand(cmd);
                document.getElementById('manualGcode').value = '';
            }
        }

        function jog(dx, dy, dz) {
            const dist = parseFloat(document.getElementById('jogDistance').value);
            const feed = document.getElementById('feedRate').value;

            const x = dx * dist;
            const y = dy * dist;
            const z = dz * dist;

            sendCommand(`$J=G91 G21 X${x} Y${y} Z${z} F${feed}`);
        }

        function setStartHere() {
            document.getElementById('startX').value = currentPos.x.toFixed(2);
            document.getElementById('startY').value = currentPos.y.toFixed(2);
            log(`Start position set to X:${currentPos.x.toFixed(2)} Y:${currentPos.y.toFixed(2)}`, 'info');
        }

        function setContact() {
            document.getElementById('contactZ').value = currentPos.z.toFixed(2);
            log(`Contact Z set to ${currentPos.z.toFixed(2)}mm`, 'info');
        }

        function goToStart() {
            const x = document.getElementById('startX').value;
            const y = document.getElementById('startY').value;
            const safeZ = document.getElementById('safeZ').value;
            const feed = document.getElementById('feedRate').value;

            sendCommand('G90');
            sendCommand(`G0 Z${safeZ}`);
            sendCommand(`G0 X${x} Y${y}`);
        }

        function penUp() {
            const safeZ = document.getElementById('safeZ').value;
            sendCommand('G90');
            sendCommand(`G0 Z${safeZ}`);
        }

        function penDown() {
            const contactZ = document.getElementById('contactZ').value;
            const feed = document.getElementById('drawFeed').value;
            sendCommand('G90');
            sendCommand(`G1 Z${contactZ} F${feed}`);
        }

        function requestPosition() {
            sendCommand('?');
        }

        setInterval(() => {
            if (isConnected) requestPosition();
        }, 1000);

        function log(msg, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        function setFont(font) {
            currentFont = font;
            document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${font}`).classList.add('active');
        }

        function getCharPaths(char, x, y, scale, widthFactor, slant) {
            const font = fonts[currentFont];
            const charData = font[char] || font[' '] || [['M', 0.3, 1]];
            const paths = [];
            const rad = slant * Math.PI / 180;

            for (let stroke of charData) {
                const type = stroke[0];
                let px = stroke[1] * scale * widthFactor;
                let py = (1 - stroke[2]) * scale; // Flip Y

                // Apply slant
                px += py * Math.tan(rad);

                const absX = x + px;
                const absY = y + py;

                if (type === 'M') {
                    paths.push({ type: 'move', x: absX, y: absY });
                } else if (type === 'L') {
                    paths.push({ type: 'line', x: absX, y: absY });
                } else if (type === 'C') {
                    // Cubic bezier
                    let cp1x = stroke[3] * scale * widthFactor + (1 - stroke[4]) * scale * Math.tan(rad);
                    let cp1y = (1 - stroke[4]) * scale;
                    let cp2x = stroke[5] * scale * widthFactor + (1 - stroke[6]) * scale * Math.tan(rad);
                    let cp2y = (1 - stroke[6]) * scale;

                    paths.push({
                        type: 'curve',
                        x: absX,
                        y: absY,
                        cp1x: x + cp1x,
                        cp1y: y + cp1y,
                        cp2x: x + cp2x,
                        cp2y: y + cp2y
                    });
                }
            }

            return paths;
        }

        function flattenBezier(p0, p1, p2, p3, tolerance) {
            // Flatten cubic bezier to line segments
            const points = [];
            const stack = [[p0, p1, p2, p3, 0, 1]];

            while (stack.length > 0) {
                const [a, b, c, d, t0, t1] = stack.pop();

                // Calculate midpoint
                const mid = {
                    x: 0.125 * (a.x + 3*b.x + 3*c.x + d.x),
                    y: 0.125 * (a.y + 3*b.y + 3*c.y + d.y)
                };

                // Check flatness
                const dx = d.x - a.x;
                const dy = d.y - a.y;
                const dist = Math.abs((b.x - a.x) * dy - (b.y - a.y) * dx) +
                            Math.abs((c.x - a.x) * dy - (c.y - a.y) * dx);

                if (dist * dist < tolerance * (dx*dx + dy*dy) || (t1 - t0) < 0.01) {
                    points.push(d);
                } else {
                    // Split bezier
                    const ab = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    const bc = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
                    const cd = { x: (c.x + d.x) / 2, y: (c.y + d.y) / 2 };
                    const abc = { x: (ab.x + bc.x) / 2, y: (ab.y + bc.y) / 2 };
                    const bcd = { x: (bc.x + cd.x) / 2, y: (bc.y + cd.y) / 2 };
                    const abcd = { x: (abc.x + bcd.x) / 2, y: (abc.y + bcd.y) / 2 };

                    stack.push([abcd, bcd, cd, d, (t0+t1)/2, t1]);
                    stack.push([a, ab, abc, abcd, t0, (t0+t1)/2]);
                }
            }

            return points;
        }

        function generateGcode() {
            const text = document.getElementById('plotText').value.toLowerCase();
            if (!text.trim()) return [];

            const fontHeight = parseFloat(document.getElementById('fontSize').value);
            const lineSpacing = parseFloat(document.getElementById('lineSpacing').value);
            const widthFactor = parseFloat(document.getElementById('widthFactor').value);
            const slant = parseFloat(document.getElementById('slant').value);
            const startX = parseFloat(document.getElementById('startX').value);
            const startY = parseFloat(document.getElementById('startY').value);
            const contactZ = parseFloat(document.getElementById('contactZ').value);
            const safeZ = parseFloat(document.getElementById('safeZ').value);
            const drawFeed = parseInt(document.getElementById('drawFeed').value);
            const travelFeed = parseInt(document.getElementById('feedRate').value);
            const connect = document.getElementById('connectLetters').checked;
            const tolerance = parseFloat(document.getElementById('smoothing').value);

            const lines = text.split('\n');
            let gcode = [];

            gcode.push('G90'); // Absolute positioning
            gcode.push(`G0 Z${safeZ} F${travelFeed}`); // Start with pen up

            let currentY = startY;
            const scale = fontHeight;
            const letterWidth = 0.7 * scale * widthFactor;

            for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
                const line = lines[lineIndex];
                let currentX = startX;
                let penIsDown = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const paths = getCharPaths(char, currentX, currentY, scale, widthFactor, slant);

                    if (paths.length === 0) {
                        currentX += letterWidth * 0.5;
                        continue;
                    }

                    // Check if we should connect to next character
                    const nextChar = line[i + 1];
                    let connectToNext = connect && nextChar && nextChar !== ' ' && fonts[currentFont][nextChar];

                    for (let j = 0; j < paths.length; j++) {
                        const path = paths[j];

                        if (path.type === 'move') {
                            if (penIsDown) {
                                gcode.push(`G0 Z${safeZ} F${travelFeed}`);
                                penIsDown = false;
                            }
                            gcode.push(`G0 X${path.x.toFixed(3)} Y${path.y.toFixed(3)} F${travelFeed}`);
                        } else if (path.type === 'line') {
                            if (!penIsDown) {
                                gcode.push(`G1 Z${contactZ} F${drawFeed}`);
                                penIsDown = true;
                            }
                            gcode.push(`G1 X${path.x.toFixed(3)} Y${path.y.toFixed(3)} F${drawFeed}`);
                        } else if (path.type === 'curve') {
                            if (!penIsDown) {
                                gcode.push(`G1 Z${contactZ} F${drawFeed}`);
                                penIsDown = true;
                            }

                            // Get previous point
                            const prevPath = paths[j-1];
                            const p0 = { x: prevPath.x, y: prevPath.y };
                            const p1 = { x: path.cp1x, y: path.cp1y };
                            const p2 = { x: path.cp2x, y: path.cp2y };
                            const p3 = { x: path.x, y: path.y };

                            const points = flattenBezier(p0, p1, p2, p3, tolerance);

                            for (let pt of points) {
                                gcode.push(`G1 X${pt.x.toFixed(3)} Y${pt.y.toFixed(3)} F${drawFeed}`);
                            }
                        }
                    }

                    currentX += letterWidth;
                }

                if (penIsDown) {
                    gcode.push(`G0 Z${safeZ} F${travelFeed}`);
                }
                currentY -= lineSpacing;
            }

            gcode.push(`G0 Z${safeZ}`);
            gcode.push(`G0 X${startX} Y${startY}`);

            return gcode;
        }

        async function plotText() {
            currentGcode = generateGcode();
            if (currentGcode.length === 0) {
                log('No text to plot', 'error');
                return;
            }

            log(`Sending ${currentGcode.length} G-code commands...`, 'info');

            for (let cmd of currentGcode) {
                await sendCommand(cmd);
                await new Promise(r => setTimeout(r, 30));
            }

            log('Plotting complete!', 'info');
        }

        function previewText() {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const text = document.getElementById('plotText').value.toLowerCase();
            if (!text.trim()) return;

            const fontHeight = parseFloat(document.getElementById('fontSize').value);
            const lineSpacing = parseFloat(document.getElementById('lineSpacing').value);
            const widthFactor = parseFloat(document.getElementById('widthFactor').value);
            const slant = parseFloat(document.getElementById('slant').value);
            const scale = fontHeight;
            const letterWidth = 0.7 * scale * widthFactor;

            // Center in canvas
            const lines = text.split('\n');
            const maxWidth = Math.max(...lines.map(l => l.length * letterWidth));
            const totalHeight = lines.length * lineSpacing;

            const offsetX = (canvas.width - maxWidth) / 2;
            const offsetY = (canvas.height - totalHeight) / 2 + (lines.length * lineSpacing) / 2;

            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let currentY = offsetY;

            for (let line of lines) {
                let currentX = offsetX;

                for (let char of line) {
                    const paths = getCharPaths(char, currentX, currentY, scale, widthFactor, slant);

                    ctx.beginPath();
                    let penDown = false;

                    for (let path of paths) {
                        if (path.type === 'move') {
                            if (penDown) ctx.stroke();
                            ctx.beginPath();
                            ctx.moveTo(path.x, canvas.height - path.y);
                            penDown = false;
                        } else if (path.type === 'line') {
                            if (!penDown) {
                                ctx.moveTo(paths[paths.indexOf(path)-1].x, canvas.height - paths[paths.indexOf(path)-1].y);
                                penDown = true;
                            }
                            ctx.lineTo(path.x, canvas.height - path.y);
                        } else if (path.type === 'curve') {
                            if (!penDown) {
                                const prev = paths[paths.indexOf(path)-1];
                                ctx.moveTo(prev.x, canvas.height - prev.y);
                                penDown = true;
                            }
                            ctx.bezierCurveTo(
                                path.cp1x, canvas.height - path.cp1y,
                                path.cp2x, canvas.height - path.cp2y,
                                path.x, canvas.height - path.y
                            );
                        }
                    }
                    ctx.stroke();

                    currentX += letterWidth;
                }

                currentY -= lineSpacing;
            }

            // Draw start point indicator
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(offsetX, canvas.height - offsetY, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.fillText('START', offsetX + 10, canvas.height - offsetY);
        }

        function exportGcode() {
            if (currentGcode.length === 0) {
                currentGcode = generateGcode();
            }

            const blob = new Blob([currentGcode.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cursive_plot.gcode';
            a.click();
            URL.revokeObjectURL(url);

            log('G-code exported', 'info');
        }

        function testPattern() {
            const startX = parseFloat(document.getElementById('startX').value);
            const startY = parseFloat(document.getElementById('startY').value);
            const contactZ = parseFloat(document.getElementById('contactZ').value);
            const safeZ = parseFloat(document.getElementById('safeZ').value);
            const feed = parseInt(document.getElementById('drawFeed').value);

            sendCommand('G90');
            sendCommand(`G0 Z${safeZ}`);
            sendCommand(`G0 X${startX} Y${startY}`);
            sendCommand(`G1 Z${contactZ} F${feed}`);

            // Draw small square
            sendCommand(`G1 X${startX + 10} Y${startY} F${feed}`);
            sendCommand(`G1 X${startX + 10} Y${startY + 10} F${feed}`);
            sendCommand(`G1 X${startX} Y${startY + 10} F${feed}`);
            sendCommand(`G1 X${startX} Y${startY} F${feed}`);

            sendCommand(`G0 Z${safeZ}`);
            log('Test pattern sent', 'info');
        }

        function saveSettings() {
            const settings = {
                safeZ: document.getElementById('safeZ').value,
                contactZ: document.getElementById('contactZ').value,
                startX: document.getElementById('startX').value,
                startY: document.getElementById('startY').value,
                fontSize: document.getElementById('fontSize').value,
                lineSpacing: document.getElementById('lineSpacing').value,
                widthFactor: document.getElementById('widthFactor').value,
                slant: document.getElementById('slant').value,
                feedRate: document.getElementById('feedRate').value,
                drawFeed: document.getElementById('drawFeed').value,
                smoothing: document.getElementById('smoothing').value
            };
            localStorage.setItem('cursivePlotterSettings', JSON.stringify(settings));
            log('Settings saved', 'info');
        }

        function loadSettings() {
            const saved = localStorage.getItem('cursivePlotterSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                document.getElementById('safeZ').value = settings.safeZ;
                document.getElementById('contactZ').value = settings.contactZ;
                document.getElementById('startX').value = settings.startX;
                document.getElementById('startY').value = settings.startY;
                document.getElementById('fontSize').value = settings.fontSize;
                document.getElementById('lineSpacing').value = settings.lineSpacing;
                document.getElementById('widthFactor').value = settings.widthFactor;
                document.getElementById('slant').value = settings.slant;
                document.getElementById('feedRate').value = settings.feedRate;
                document.getElementById('feedRateVal').textContent = settings.feedRate;
                document.getElementById('drawFeed').value = settings.drawFeed;
                document.getElementById('smoothing').value = settings.smoothing;

                // Update slider displays
                document.getElementById('fontSizeVal').textContent = settings.fontSize;
                document.getElementById('widthFactorVal').textContent = settings.widthFactor;
                document.getElementById('slantVal').textContent = settings.slant;
                document.getElementById('lineSpacingVal').textContent = settings.lineSpacing;

                log('Settings loaded', 'info');
            }
        }

        window.onload = loadSettings;

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            switch(e.key) {
                case 'ArrowUp': jog(0, 1, 0); break;
                case 'ArrowDown': jog(0, -1, 0); break;
                case 'ArrowLeft': jog(-1, 0, 0); break;
                case 'ArrowRight': jog(1, 0, 0); break;
                case 'PageUp': jog(0, 0, 1); break;
                case 'PageDown': jog(0, 0, -1); break;
                case 'Home': sendCommand('$H'); break;
            }
        });
    </script>
